<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2d52">
<link rel="manifest" href="manifest.webmanifest">
<title>مدیریت آنلاین لایسنس کسری</title>
<style>
:root{
  --bg:#09111c;
  --card:#111c2a;
  --border:#1e2d3d;
  --text:#f1f5f9;
  --muted:#889ab0;
  --c1:#0b2d52;
  --c2:#1a72cc;
  --gold:#e8a020;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Tahoma, Vazirmatn, sans-serif;
  color:var(--text);
  background:radial-gradient(circle at top, #12345f 0%, var(--bg) 55%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.card{
  width:min(560px,100%);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  box-shadow:0 14px 40px rgba(0,0,0,.35);
}
h1{margin:0 0 8px;font-size:20px}
p{margin:0 0 16px;color:var(--muted);line-height:1.9;font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.btn{
  display:block;
  text-align:center;
  text-decoration:none;
  color:#fff;
  padding:12px 14px;
  border-radius:10px;
  font-weight:700;
  font-size:14px;
}
.primary{background:linear-gradient(135deg,var(--c1),var(--c2))}
.note{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.9}
</style>
</head>
<body>
  <main class="card">
    <h1>مدیریت آنلاین لایسنس کسری</h1>
    <p>این صفحه فقط برای مدیر سیستم است. از اینجا لایسنس‌ها را بسازید، تمدید کنید و به صورت آنلاین کنترل کنید.</p>
    <div class="grid">
      <a class="btn primary" href="./ai_studio_code (6).html">ورود به پنل مدیریت (آنلاین)</a>
    </div>
    <div class="note">نسخه مشتری به صورت آفلاین برای کاربر ارسال می‌شود و فقط اعتبار لایسنس به صورت آنلاین بررسی می‌گردد.</div>
  </main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
